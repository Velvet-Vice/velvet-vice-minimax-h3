name: Restore Civitai Master and Publish 1.4.4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore_civitai_master_144.yml"

permissions:
  contents: write

jobs:
  restore-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Restore exact Civitai v1.4.3 master files
        shell: bash
        run: |
          cat > /tmp/h3_master.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/h3_master.b64 > /tmp/h3_master.tar.gz
          tar -xzf /tmp/h3_master.tar.gz -C .

      - name: Advance release metadata only to 1.4.4
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          old = "1.4.3"
          new = "1.4.4"

          for rel in [
              "README.md",
              "pyproject.toml",
              "version.py",
              "services/taeh3_auto.py",
              "services/templates.py",
              "web/minimax_h3_workspace.js",
              "web/zzzzzzzzzzzzz_velvet_vice_suite_v1115.js",
              "web/zzzzzzzzzzzzzzz_minimax_h3_live_preview_v140.js",
          ]:
              p = Path(rel)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"Expected {old} in {rel}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          old_wf = Path("workflow_examples/VELVET_VICE_MINIMAX_H3_I2V_v1.4.3.json")
          new_wf = Path("workflow_examples/VELVET_VICE_MINIMAX_H3_I2V_v1.4.4.json")
          wf = json.loads(old_wf.read_text(encoding="utf-8"))

          def walk(value):
              if isinstance(value, dict):
                  props = value.get("properties")
                  if isinstance(props, dict) and props.get("cnr_id") == "velvet-vice-minimax-h3":
                      props["ver"] = new
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          walk(wf)
          for node in wf.get("nodes", []):
              if node.get("id") == 2366:
                  node["title"] = f"VELVET VICE — MINIMAX H3 I2V · v{new}"
                  node["widgets_values"] = [f"VELVET VICE — MINIMAX H3 I2V · v{new}"]

          extra = wf.setdefault("extra", {})
          release = extra.get("velvet_vice_release")
          if isinstance(release, dict):
              release["version"] = new
              release["source_workflow"] = f"VELVET_VICE_MINIMAX_H3_I2V_v{new}"
          extra["velvet_vice_version"] = new
          extra["velvet_vice_h3_architecture"] = new
          extra["velvet_vice_ui_audit"] = f"v{new}-static-ui-native-resize"

          new_wf.write_text(json.dumps(wf, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          old_wf.unlink()

          reg = Path("REGISTRY_PUBLISHING.md")
          if reg.exists():
              reg.write_text(reg.read_text(encoding="utf-8").replace(old, new), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          if changelog.exists():
              text = changelog.read_text(encoding="utf-8")
              header = (
                  "# Changelog\n\n"
                  "## 1.4.4 — 2026-09-05\n\n"
                  "Canonical synchronization release based on the verified Civitai v1.4.3 master ZIP. "
                  "Runtime and UI behavior are unchanged from that master; only release metadata is advanced to 1.4.4.\n\n"
              )
              if not text.startswith("# Changelog\n\n## 1.4.4"):
                  if text.startswith("# Changelog\n\n"):
                      text = header + text[len("# Changelog\n\n"):]
                  else:
                      text = header + text
                  changelog.write_text(text, encoding="utf-8")

          sync = Path(".github/workflows/restore_civitai_master_144.yml")
          if sync.exists():
              sync.unlink()
          PY

      - name: Validate exact canonical runtime and workflow metadata
        shell: bash
        run: |
          python -m compileall -q nodes services .
          for file in web/*.js; do node --check "$file"; done
          python - <<'PY'
          from pathlib import Path
          import json

          wf_path = Path("workflow_examples/VELVET_VICE_MINIMAX_H3_I2V_v1.4.4.json")
          wf = json.loads(wf_path.read_text(encoding="utf-8"))
          refs = []

          def walk(value):
              if isinstance(value, dict):
                  props = value.get("properties")
                  if isinstance(props, dict) and props.get("cnr_id") == "velvet-vice-minimax-h3":
                      refs.append(props.get("ver"))
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)

          walk(wf)
          assert len(refs) == 23, refs
          assert set(refs) == {"1.4.4"}, refs
          assert 'version = "1.4.4"' in Path("pyproject.toml").read_text(encoding="utf-8")
          assert 'PACK_VERSION = "1.4.4"' in Path("version.py").read_text(encoding="utf-8")
          assert not Path("workflow_examples/VELVET_VICE_MINIMAX_H3_I2V_v1.4.3.json").exists()
          print("Validated 23/23 H3 Registry references at 1.4.4")
          PY

      - name: Commit canonical release
        shell: bash
        run: |
          git config user.name "Velvet Vice"
          git config user.email "daagle42@googlemail.com"
          git add -A
          git commit -m "Restore Civitai master and publish MiniMax H3 1.4.4"
          git push origin main
