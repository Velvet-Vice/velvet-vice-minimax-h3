name: Finalize canonical Civitai 1.4.3 restore

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize_canonical_restore.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct exact canonical design system
        shell: bash
        run: |
          set -euo pipefail
          : > web/00_velvet_vice_design_system_v1115_drag_safe.js
          for f in .restore_tmp/design_00.b64 .restore_tmp/design_01.b64 .restore_tmp/design_02.b64 .restore_tmp/design_03.b64 .restore_tmp/design_04.b64; do
            tr -cd 'A-Za-z0-9+/=' < "$f" | base64 -d >> web/00_velvet_vice_design_system_v1115_drag_safe.js
          done
          echo "326d8a01ba6f49aeabcca0078889b179126f5a8cb881a960dab4ba2b7d6f07a3  web/00_velvet_vice_design_system_v1115_drag_safe.js" | sha256sum -c -
          node --check web/00_velvet_vice_design_system_v1115_drag_safe.js

      - name: Commit canonical restore and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Velvet Vice"
          git config user.email "daagle42@googlemail.com"
          rm -rf .restore_tmp
          rm -f .github/workflows/restore_civitai_master_144.yml
          rm -f .github/workflows/finalize_canonical_restore.yml
          git add -A
          git commit -m "Restore exact Civitai 1.4.3 canonical design system"
          git push

# retry after verified chunk hashes
